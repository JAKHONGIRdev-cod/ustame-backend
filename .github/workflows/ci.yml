# Har push va PR'da: go vet va testlar. Railway push'dan keyin o'zi yangilanadi — bu tekshiruv xatoni
# hech bo'lmasa darhol ko'rsatadi. SQL testlari alohida (usta-api: migrate-app.js --test, test bazada).
name: Tekshiruv

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...

      - run: go test ./...
